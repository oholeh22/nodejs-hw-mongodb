openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts manager
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: This is a contact manager app.

servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-1d4o.onrender.com

tags:
  - name: Contacts
    description: Operations about contacts.
  - name: Auth
    description: Auth operations.

paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'

  /contacts/{contactId}:
    get:
      $ref: '../swagger/paths/contacts/{contactId}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{contactId}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{contactId}/delete.yaml'

  /auth/register:
    post:
      $ref: '../swagger/paths/auth/register-post.yaml'
  /auth/login:
    post:
      $ref: '../swagger/paths/auth/login-post.yaml'
  /auth/refresh:
    post:
      $ref: '../swagger/paths/auth/refresh-post.yaml'
  /auth/logout:
    post:
      $ref: '../swagger/paths/auth/logout-post.yaml'
  /auth/send-reset-email:
    post:
      $ref: '../swagger/paths/auth/reset-email-post.yaml'
  /auth/reset-password:
    post:
      $ref: '../swagger/paths/auth/password-reset-post.yaml'

components:
  schemas:
    user:
      $ref: ../swagger/components/schemas/contact.yaml
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
